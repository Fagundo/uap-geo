# v1: replicate Medina, Brewer & Kirkpatrick (2023) at county level, then add geology.
# A source with `enabled: false` or no `urls` is skipped and its covariate is dropped from the models.

study:
  start_year: 2001
  end_year: 2020
  crs: "EPSG:5070"            # CONUS Albers equal-area, metres
  knn_k: 8                    # neighbours for Gi* and Moran's I (as in the paper)
  gi_permutations: 999
  shift_permutations: 100     # shifted copies per tested layer
  shift_layers:               # layers whose exact placement is tested (faults/earthquakes were regional in v1)
    - rivers
    - lakes
    - reservoirs
  min_reservoir_acre_ft: 1000 # dams below this normal storage are not counted as reservoirs
  place_match_km: 5           # report-level test: a report belongs to the nearest Census place within this distance
  max_shift_km: 400
  max_rotate_deg: 20
  min_quake_magnitude: 2.5
  seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  outputs: outputs

models:
  observer:                   # model A: the paper's covariates (minus any that are unavailable)
    - light_pollution
    - cloud_cover
    - tree_canopy
    - airports_per_km2
    - military_area_share
    - log_pop_density         # stand-in for light pollution when that raster is not configured
  geology:                    # model B adds these to model A
    - fault_length_per_km2
    - log_quake_count
    - river_length_per_km2
    - magnetic_anomaly
  region_effects:             # model C = model B + these categorical fixed effects
    - state_fips
  settlement_controls:        # model D = model C + these; reports sit at town points and towns sit on rivers
    - places_per_km2
  water_terrain:              # model E = model D + other water and a terrain control
    - lake_area_share
    - dist_to_lake_km
    - reservoirs_per_km2
    - dist_to_coast_km
    - elevation_relief_m
  radiation:                  # model F = model E + these. Binary band columns are not standardized.
    - gamma_uranium
    - gamma_thorium
    - gamma_potassium
    - nuclear_power_within_50km
    - weapons_site_within_100km

sources:
  nuforc:                     # TidyTuesday 2023-06-20 NUFORC extract (sightings, then places)
    options:
      format: tidytuesday     # or "json" for a raw NUFORC JSON dump (single URL)
    urls:
      - https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2023/2023-06-20/ufo_sightings.csv
      - https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2023/2023-06-20/places.csv
  counties:
    urls:
      - https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_county_500k.zip
  population:                 # tried in order; format detected from content
    urls:
      - https://www2.census.gov/programs-surveys/popest/datasets/2020-2023/counties/totals/co-est2023-alldata.csv
      - https://www2.census.gov/programs-surveys/popest/datasets/2020-2022/counties/totals/co-est2022-alldata.csv
      - "https://api.census.gov/data/2020/dec/pl?get=P1_001N&for=county:*&in=state:*"
  gazetteer_places:
    urls:
      - https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2020_Gazetteer/2020_Gaz_place_national.zip
  gazetteer_cousubs:
    urls:
      - https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2020_Gazetteer/2020_Gaz_cousubs_national.zip
  airports:
    urls:
      - https://davidmegginson.github.io/ourairports-data/airports.csv
  military:
    urls:
      - https://www2.census.gov/geo/tiger/TIGER2019/MIL/tl_2019_us_mil.zip
  faults:
    urls:
      - https://www.sciencebase.gov/catalog/file/get/589097b1e4b072a7ac0cae23?name=Qfaults_GIS.zip
      - https://earthquake.usgs.gov/static/lfs/nshm/qfaults/Qfaults_GIS.zip
  earthquakes:
    urls:
      - https://earthquake.usgs.gov/fdsnws/event/1/query
    options:
      bbox: [-125.0, 24.0, -66.5, 49.5]   # min lon, min lat, max lon, max lat
  rivers:
    urls:
      - https://naciscdn.org/naturalearth/10m/physical/ne_10m_rivers_north_america.zip
      - https://naciscdn.org/naturalearth/10m/physical/ne_10m_rivers_lake_centerlines.zip
  lakes:                      # Natural Earth 1:10m lakes + North America supplement (same scale as rivers)
    urls:
      - https://naciscdn.org/naturalearth/10m/physical/ne_10m_lakes.zip
      - https://naciscdn.org/naturalearth/10m/physical/ne_10m_lakes_north_america.zip
  coastline:                  # ocean coast; the Great Lakes are in `lakes`
    urls:
      - https://naciscdn.org/naturalearth/10m/physical/ne_10m_coastline.zip
  reservoirs:                 # USACE National Inventory of Dams, nationwide CSV
    urls:
      - https://nid.sec.usace.army.mil/api/nation/csv
  elevation:                  # EarthEnv 1 km median elevation (GMTED2010); per-county relief = max - min
    urls:
      - https://data.earthenv.org/topography/elevation_1KMmd_GMTEDmd.tif
  gamma_rays:                 # USGS Bayesian NURE grids (eU, eTh, K); files discovered via the ScienceBase API
    urls:
      - "https://www.sciencebase.gov/catalog/item/5dd2f264e4b0695797628351?format=json"
    options:
      item_id: 5dd2f264e4b0695797628351
      patterns:               # regex on file names; files matching `exclude` (uncertainty grids) are skipped
        gamma_uranium: '(?i)(?<![a-z])eu(?![a-z])|uranium'
        gamma_thorium: '(?i)(?<![a-z])eth(?![a-z])|thorium'
        gamma_potassium: '(?i)(?<![a-z])k(?![a-z])|potassium'
      exclude: '(?i)(?<![a-z])(sd|std|stdev|var|uncert[a-z]*|lower|upper|ci|q\d+)(?![a-z])|\.xml$|metadata'
  nuclear_power:              # US commercial reactor units (operating or since shut down)
    urls:
      - https://michaelminn.net/tutorials/data/2018-nuclear-plants.geojson
    options:
      exclude_status: [Planned, Under Construction, Unfinished, Cancelled]
  weapons_sites:              # nuclear weapons complex: DOE labs/plants, ICBM wings, bomber/SSBN bases (approximate centres)
    urls: [config]            # no download: the sites are listed below
    options:
      sites:
        - [Hanford Site, 46.55, -119.49]
        - [Idaho National Laboratory, 43.52, -112.95]
        - [Los Alamos National Laboratory, 35.88, -106.30]
        - [Kirtland AFB / Sandia, 35.05, -106.55]
        - [Nevada National Security Site, 37.10, -116.05]
        - [Pantex Plant, 35.32, -101.56]
        - [Oak Ridge / Y-12, 35.99, -84.25]
        - [Savannah River Site, 33.28, -81.68]
        - [Rocky Flats, 39.89, -105.20]
        - [Lawrence Livermore National Laboratory, 37.69, -121.71]
        - [Waste Isolation Pilot Plant, 32.37, -103.79]
        - [White Sands / Trinity, 33.68, -106.48]
        - [Malmstrom AFB (ICBM), 47.51, -111.19]
        - [Minot AFB (ICBM), 48.42, -101.36]
        - [F.E. Warren AFB (ICBM), 41.13, -104.87]
        - [Whiteman AFB (B-2), 38.73, -93.55]
        - [Barksdale AFB (B-52), 32.50, -93.66]
        - [Naval Submarine Base Kings Bay, 30.80, -81.56]
        - [Naval Base Kitsap-Bangor, 47.72, -122.71]
  cloud_cover:
    urls:
      - https://data.earthenv.org/cloud/MODCF_meanannual.tif
  light_pollution:            # Falchi et al. (2016) World Atlas of artificial sky brightness, GFZ (653 MB zip)
    urls:
      - https://datapub.gfz-potsdam.de/download/10.5880.GFZ.1.4.2016.001/World_Atlas_2015.zip
  tree_canopy:                # NLCD/USFS Tree Canopy Cover CONUS; 30 m tiles are too large for a free runner
    enabled: false
    urls: []
  magnetic_anomaly:           # USGS / NAMAG magnetic anomaly grid; set a direct GeoTIFF URL to enable
    enabled: false
    urls: []
