# Explanation filter rules. Versioned like hypotheses: a changed rule set gets a new version,
# recorded in every result that uses it. The filtered tier drops events matched at high confidence only.
# v1 approved 2026-11-10. v2 (2026-11-10) after validation (results/filters/validation_v1.md):
#   aurora    -> medium only, no Kp clause: ~3% precision, and the Kp clause keyed on the storm exposure
#   fireworks -> medium only: ~3% precision (matches fireworks as context, not as the cause)
#   meteor    -> excludes reports that describe hovering, turns or "slower than a meteor" (77% -> 92% in sample)
#   nuforc_note -> also matches notes naming a star, Sirius, missile, advertising lights or lens flare
version: 2
rules:
  starlink_train:
    applies_from: 2019-05-24
    text_any: ["line of lights", "string of lights", "train of lights", "lights in a row", "evenly spaced", "starlink"]
    high_if: within 10 days after a Starlink launch and within 2 hours of local dusk or dawn
    else: medium
  rocket_plume:
    text_any: [plume, spiral, jellyfish, rocket]
    timing: 0-60 minutes after a launch within 1000 km
    high_if: text and timing both match
    else: medium
  sky_lantern:
    text_all_groups: [["orange", "red"], ["orb", "orbs", "ball", "balls"], ["drift", "floating", "slow", "silent", "rising"]]
    high_if: July 3-5 or Dec 31-Jan 1
    else: medium
  fireworks:
    text_any: [firework, burst, "colored flashes"]
    dates: [July 3-5, Dec 31-Jan 1]
    local_time: evening
    confidence: medium   # v2: was high
  aurora:
    text_any: ["aurora borealis", "northern lights"]
    confidence: medium   # v2: was high, with a Kp >= 5 clause (circular with H-geo-01's storm exposure)
  planet:
    text_any: [stationary, hovering, "not moving", "bright star"]
    duration_min_minutes: 15
    check: Venus or Jupiter brighter than magnitude -2 and above the horizon at that place and time (Skyfield)
    high_if: reported direction matches the planet
    else: medium
  aircraft_helicopter:
    text_any: ["blinking red", "blinking green", "strobe", "engine sound", rotor, "like a plane", "like a helicopter"]
    confidence: medium
  drone:
    text_any: [drone, quadcopter, buzzing]
    confidence: medium
  meteor_fireball:
    text_any: [streak, "shooting star", fireball, meteor]
    text_none: [hover, stationary, "stopped", "changed direction", "changes direction", "change direction",
                "changed course", "changes course", "zig", "not a meteor", "not a shooting star",
                "slower than", "other than a meteor", "directional change"]
    duration_max_seconds: 10
    boost: major meteor-shower peak nights
    confidence: high
  iss_satellite_flare:
    check: a steady light crossing in 2-6 minutes matching a visible ISS pass, or a brief flare
    phase: later (needs historical orbit data)
    confidence: high when matched
  nuforc_note:
    text_regex: "\\(\\(NUFORC Note:.*?(starlink|iss|international space station|satellite|planet|venus|jupiter|sirius|star|lantern|hoax|aircraft|meteor|rocket|missile|flare|advertis).*?\\)\\)"
    confidence: high
validation: hand-label about 300 random summaries; drop or tighten any rule below 80% precision
circularity_guard: a hypothesis lists in filters_disabled any rule that keys on its own exposure
