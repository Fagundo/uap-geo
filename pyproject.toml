[project]
name = "uap-geo"
version = "0.1.0"
description = "Tests whether UAP report clusters in the US relate to geology (faults, rivers, magnetics) after controlling for observer opportunity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "rasterio>=1.3",
    "rasterstats>=0.19",
    "statsmodels>=0.14",
    "libpysal>=4.10",
    "esda>=2.5",
    "matplotlib>=3.8",
    "anthropic>=0.40",
]

[project.scripts]
uap-geo = "uap_geo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uap_geo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
