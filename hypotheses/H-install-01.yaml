# Pre-registered 2026-11-11, after the explore run (2001-2010) and before any 2021+ analysis.
# Do not edit. A changed hypothesis gets a new ID; the registry stores this file's hash.
# Registered knowing estimated 2021+ power is low (installations ~58%, volcanoes ~9%).
id: H-install-01
title: Proximity to military installations
status: registered
registered: 2026-11-11
claim: >
  Counties closer to a military installation report more UAP events than the observer controls
  predict, and the real installation map lines up with high-reporting counties better than rigidly
  shifted copies of it.
origin: >
  Suggested on 2026-11-11 by the H-persist-01 watch list (2001-2020), where many top counties sit near
  installations (Dare County bombing range, NAS Oceana, Keesler AFB, NAS Key West, Yuma Proving Ground,
  Quantico). Because the idea came from 2001-2020 data, the confirm split is 2021 onward.
literature:
  - "Medina, Brewer & Kirkpatrick (2023), Scientific Reports: military land share among the county covariates (weak)."

data:
  reports: TidyTuesday 2023-06-20 NUFORC extract
  installations: Census TIGER/Line 2019 military installation polygons (contiguous US)
  covariates: as H-persist-01 (v1 confirmatory controls, seasonal-housing and college-enrollment shares, state fixed effects)

unit: county x period
outcome: events per county in the period, after removing holiday and launch nights (as H-persist-01)
outcome_tiers: [all, filtered, high_quality]
primary_tier: filtered
model: >
  negative binomial rate model, offset log(population x nights kept), controls, state fixed effects,
  standard errors clustered by state, plus closeness = -log(distance to the nearest installation + 5 km),
  standardized

tests:
  proximity:
    exposure: closeness to the nearest military installation (per SD)
    prediction: rate_ratio > 1
    discriminating_checks:
      - "layer-shift test: the real installation layer's rate ratio exceeds that of rigidly rotated
        (up to 20 degrees) and shifted (up to 400 km) copies, one-sided p < 0.05 over 200 copies"

splits:
  explore: [2001, 2010]   # explore; 2011-2020 is not used (the idea came from it)
  confirm: [2021, null]

multiple_testing: none needed (one primary test)
smallest_effect_of_interest: 1.10   # rate ratio per SD of closeness
decision_rules:
  confirmed: p < 0.05 and rate ratio > 1 in the filtered tier on the confirm split, and the shift test holds
  refuted: power >= 0.80 and the upper 95% confidence limit is below 1.10
  underpowered: power < 0.50

limits: >
  A confirmed effect would fit military activity being misreported (aircraft, flares, drones, tests)
  as well as anything else near installations; it cannot separate the two. Airports are controlled, so
  an effect is not just general aviation.
