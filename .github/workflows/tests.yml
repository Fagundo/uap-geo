name: tests

on:
  push:
    paths: ["src/**", "tests/**", "configs/**", "hypotheses/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q
