name: build data

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Data-building script to run"
        type: choice
        options: [build_championships]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Build
        env:
          SCRIPT: ${{ inputs.script }}
        run: uv run python "scripts/${SCRIPT}.py"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          git diff --cached --quiet || git commit -m "Build data: ${{ inputs.script }}"
          git pull --rebase && git push
